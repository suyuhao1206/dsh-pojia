# Release 工作流：推 master 时做一遍语法自检；tag 发版按需在这里扩展。
# 守卫已指向本插件发布仓库 suyuhao1206/dsh-pojia，其它 fork 默认跳过。
name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'suyuhao1206/dsh-pojia'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Syntax-check plugin entry
        run: |
          node --check lib/index.js
          node --check lib/core.js
          node --check lib/reapply.js
          node --input-type=module -e "import './lib/index.js'"
